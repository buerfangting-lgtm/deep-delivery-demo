<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>选择角色 — DeepDelivery</title>
    <link rel="stylesheet" href="styles/theme.css">
    <style>
        .select-page {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px 20px;
            background: var(--gray-950); position: relative; overflow: hidden;
        }
        .bg-glow {
            position: absolute; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 70%);
            top: 20%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
        .select-logo { font-size: 13px; font-weight: 900; letter-spacing: 3px; color: var(--blue-400); margin-bottom: 12px; opacity: 0.8; }
        .select-greeting { font-size: 28px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.5px; }
        .select-hint { font-size: 14px; color: var(--gray-500); margin-bottom: 48px; font-weight: 600; }

        .role-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            width: 100%; max-width: 400px;
        }

        .role-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-xl); padding: 32px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); text-decoration: none; color: var(--white);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .role-card:hover { 
            background: rgba(37,99,235,0.1); border-color: var(--blue-500); transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(37,99,235,0.1); 
        }
        .role-card:active { transform: translateY(-2px) scale(0.98); }

        .role-icon {
            width: 64px; height: 64px; border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center; font-size: 32px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }
        .role-driver .role-icon { background: linear-gradient(135deg, rgba(37,99,235,0.2) 0%, transparent 100%); }
        .role-order .role-icon { background: linear-gradient(135deg, rgba(16,185,129,0.2) 0%, transparent 100%); }
        .role-aftersale .role-icon { background: linear-gradient(135deg, rgba(245,158,11,0.2) 0%, transparent 100%); }
        .role-boss .role-icon { background: linear-gradient(135deg, rgba(139,92,246,0.2) 0%, transparent 100%); }

        .role-card:hover .role-icon { transform: scale(1.1) rotate(4deg); }

        .role-name { font-size: 18px; font-weight: 800; letter-spacing: -0.2px; }
        .role-desc { font-size: 12px; color: var(--gray-500); line-height: 1.5; font-weight: 600; }

        .select-footer { margin-top: 56px; font-size: 12px; color: var(--gray-600); font-weight: 700; }
        .select-footer a { color: var(--blue-400); text-decoration: none; }
    </style>
</head>
<body>
    <div class="select-page">
        <div class="bg-glow"></div>
        <div class="select-logo animate-fadeInUp">DEEPDELIVERY</div>
        <div class="select-greeting animate-fadeInUp delay-1">你好，请选择工作场景</div>
        <div class="select-hint animate-fadeInUp delay-1">选角色 = 选工作场景，随时可切换</div>

        <div class="role-grid">
            <a href="driver.html" class="role-card role-driver animate-fadeInUp delay-2">
                <div class="role-icon">🚚</div>
                <div class="role-name">司机</div>
                <div class="role-desc">配送、报售后、登记周转筐</div>
            </a>
            <a href="order.html" class="role-card role-order animate-fadeInUp delay-2">
                <div class="role-icon">📋</div>
                <div class="role-name">订单员</div>
                <div class="role-desc">接收客户信息、提交售后需求</div>
            </a>
            <a href="aftersale.html" class="role-card role-aftersale animate-fadeInUp delay-3">
                <div class="role-icon">🔧</div>
                <div class="role-name">售后专员</div>
                <div class="role-desc">处理工单、采购补送、提交凭证</div>
            </a>
            <a href="boss.html" class="role-card role-boss animate-fadeInUp delay-3">
                <div class="role-icon">👔</div>
                <div class="role-name">老板</div>
                <div class="role-desc">看全局、AI总结、做决策</div>
            </a>
        </div>

        <div class="select-footer animate-fadeInUp delay-4">
            <a href="index.html">← 返回产品介绍</a>
        </div>
    </div>
</body>
</html>
