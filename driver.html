<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>司机执行端 (多维工作台) — DeepDelivery</title>
    <link rel="stylesheet" href="styles/theme.css">
    <style>
        .driver-layout { display: flex; flex-direction: column; height: 100vh; background: var(--gray-950); overflow: hidden; }

        /* Header */
        .driver-header {
            padding: 20px 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); background: rgba(3, 7, 18, 0.4); backdrop-filter: blur(12px); flex-shrink: 0;
        }
        .header-left { display: flex; flex-direction: column; }
        .header-title { font-size: 20px; font-weight: 900; color: var(--white); letter-spacing: -0.5px; }
        .header-sub { font-size: 11px; color: var(--gray-500); margin-top: 2px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        
        /* Main Viewport */
        .viewport { flex: 1; overflow-y: auto; position: relative; }
        .page-section { display: none; padding-bottom: 100px; }
        .page-section.active { display: block; }

        /* Task List Styles */
        .task-scroll { padding: 16px 20px; }
        .section-label { font-size: 11px; font-weight: 900; color: var(--gray-500); margin: 32px 0 16px; letter-spacing: 1.5px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }

        .task-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-xl); padding: 18px; margin-bottom: 16px;
            display: flex; flex-direction: column; gap: 16px; position: relative; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .task-card.active { border-left: 4px solid var(--blue-500); background: rgba(37,99,235,0.06); box-shadow: var(--glow-blue); }
        .task-card.flex-active { border-left: 4px solid var(--gray-600); }
        .task-card.delivered { border-left: 4px solid var(--amber-500); background: rgba(245,158,11,0.04); }
        .task-card.closed { border-left: 4px solid var(--green-500); background: rgba(34, 197, 94, 0.02); opacity: 0.6; }

        .task-main { display: flex; justify-content: space-between; align-items: flex-start; }
        .task-info { flex: 1; }
        .task-name { font-size: 18px; font-weight: 800; color: var(--white); letter-spacing: -0.2px; }
        .task-time { font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--gray-400); }
        .time-badge { font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .badge-strict { background: rgba(239,68,68,0.15); color: var(--rose-500); }
        .badge-flex { background: var(--glass-bg); color: var(--gray-500); border: 1px solid var(--glass-border); }
        
        .status-tag { font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: var(--radius-full); text-transform: uppercase; letter-spacing: 0.5px; }
        .tag-waiting { background: rgba(37,99,235,0.15); color: var(--blue-400); }
        .tag-delivered { background: rgba(245,158,11,0.15); color: var(--amber-500); }
        .tag-closed { background: rgba(34,197,94,0.15); color: var(--green-500); }

        .task-actions { display: flex; gap: 10px; }
        .action-btn {
            flex: 1; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer;
            border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--gray-300);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-confirm { background: var(--blue-600); color: white; border: none; box-shadow: 0 8px 16px rgba(37,99,235,0.25); }
        .btn-voice { background: var(--glass-bg-hover); border-color: var(--glass-border-bright); }

        /* Notification bars in cards */
        .task-notif { font-size: 11px; padding: 8px 12px; border-radius: 8px; margin-top: -8px; font-weight: 800; }
        .notif-warn { background: rgba(245,158,11,0.1); color: var(--amber-500); border: 1px solid rgba(245,158,11,0.2); }
        .notif-crate { background: rgba(37,99,235,0.1); color: var(--blue-400); border: 1px solid rgba(37,99,235,0.2); }

        /* Summary View (After close) */
        .task-summary { background: rgba(255,255,255,0.02); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--glass-border); }
        .summary-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
        .summary-label { color: var(--gray-500); }
        .summary-val { color: var(--gray-300); text-align: right; }
        .summary-val .issue { color: var(--rose-500); }
        .summary-photo-tag { font-size: 10px; background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; margin-left: 4px; }

        /* Voice Reporting Sheet */
        .voice-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--gray-900);
            border-top: 1px solid var(--glass-border-bright); border-radius: 24px 24px 0 0;
            padding: 32px 24px 48px; z-index: 2000; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center;
        }
        .voice-sheet.show { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 4px; background: var(--gray-700); border-radius: 2px; margin-bottom: 24px; }
        
        .voice-title { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
        .voice-desc { font-size: 14px; color: var(--gray-500); margin-bottom: 32px; font-weight: 600; text-align: center; line-height: 1.5; }
        
        .mic-btn-container { position: relative; width: 100px; height: 100px; margin-bottom: 32px; }
        .mic-wave {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; background: var(--blue-600); opacity: 0.3;
            animation: pulse 2s infinite; display: none;
        }
        .mic-btn {
            position: relative; width: 100px; height: 100px; border-radius: 50%;
            background: var(--blue-600); border: none; display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: white; cursor: pointer; box-shadow: 0 10px 30px rgba(37,99,235,0.4);
        }
        .mic-btn.active { transform: scale(0.9); background: var(--red-500); box-shadow: 0 0 30px rgba(239,68,68,0.5); }
        
        /* AI Parsing Simulation */
        .ai-parsing { width: 100%; margin-top: 20px; display: none; }
        .parsing-bubble {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 16px; margin-bottom: 16px; position: relative;
        }
        .parsing-bubble::after { content: 'AI 实时识别中...'; position: absolute; top: -10px; left: 16px; background: var(--blue-600); font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 4px; }
        .transcript { font-size: 16px; font-weight: 700; color: var(--white); line-height: 1.6; }

        .ai-results { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .ai-item { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; }
        .ai-label { font-size: 10px; color: var(--gray-600); font-weight: 900; text-transform: uppercase; margin-bottom: 4px; }
        .ai-val { font-size: 14px; font-weight: 800; color: var(--blue-400); }

        /* Photo Evidence */
        .photo-block { width: 100%; margin-top: 24px; display: none; }
        .photo-btn {
            width: 100%; padding: 18px; border-radius: 16px; background: rgba(255,255,255,0.03);
            border: 2px dashed var(--glass-border); color: var(--gray-400); font-size: 15px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer;
        }
        .photo-btn.success { background: rgba(34,197,94,0.05); border-color: var(--green-500); color: var(--green-500); border-style: solid; }

        .submit-voice-btn { width: 100%; margin-top: 32px; padding: 18px; border-radius: var(--radius-lg); background: var(--blue-600); border: none; color: white; font-size: 16px; font-weight: 900; display: none; cursor: pointer; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 72px;
            background: rgba(17,24,39,0.9); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 10px; z-index: 1000;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--gray-600); cursor: pointer; }
        .nav-item.active { color: var(--blue-500); }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 10px; font-weight: 800; }

        @keyframes pulse { 0% { transform: scale(1); opacity: 0.3; } 100% { transform: scale(1.5); opacity: 0; } }

        /* Toast */
        .toast {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            background: var(--blue-600); color: white; padding: 12px 24px;
            border-radius: var(--radius-full); font-weight: 800; font-size: 14px;
            z-index: 3000; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="driver-layout">
        <header class="driver-header">
            <div class="header-left">
                <span class="header-title">配送工作台</span>
                <span class="header-sub">2026年4月7日 · 晨间班次</span>
            </div>
            <div class="header-right">
                <a href="select.html" class="switch-btn">🔄 切换</a>
                <span class="header-badge" style="color:var(--blue-400);">张师傅</span>
            </div>
        </header>

        <main class="viewport">
            <!-- PAGE: 待执行 -->
            <section id="pending" class="page-section active">
                <div class="task-scroll">
                    <div class="section-label">正在执行</div>
                    <div class="task-card active" id="card-二中">
                        <div class="task-main">
                            <div class="task-info">
                                <div class="task-name">温州二中 (南大门)</div>
                                <div class="task-time"><span class="time-badge badge-strict">准时</span> 预计 07:15 前送达</div>
                            </div>
                            <div class="status-tag tag-waiting">配送中</div>
                        </div>
                        <div class="task-actions">
                            <button class="action-btn btn-confirm" onclick="confirmDeliver('card-二中')">✅ 确认送达</button>
                            <button class="action-btn btn-voice" onclick="openVoice('card-二中')">🎙️ 语音报售后</button>
                        </div>
                    </div>

                    <div class="section-label">后续任务</div>
                    <div class="task-card flex-active" id="card-实小">
                        <div class="task-main">
                            <div class="task-info">
                                <div class="task-name">实验小学</div>
                                <div class="task-time"><span class="time-badge badge-flex">灵活</span> 建议 08:30 前</div>
                            </div>
                            <div class="status-tag" style="background:rgba(255,255,255,0.05); color:var(--gray-600);">等待中</div>
                        </div>
                    </div>

                    <div class="task-card flex-active" id="card-一中">
                        <div class="task-main">
                            <div class="task-info">
                                <div class="task-name">温州一中</div>
                                <div class="task-time"><span class="time-badge badge-flex">灵活</span> 建议 09:00 前</div>
                            </div>
                            <div class="status-tag" style="background:rgba(255,255,255,0.05); color:var(--gray-600);">等待中</div>
                        </div>
                    </div>

                    <div class="task-card flex-active" id="card-市府">
                        <div class="task-main">
                            <div class="task-info">
                                <div class="task-name">市府办食堂</div>
                                <div class="task-time"><span class="time-badge badge-flex">灵活</span> 建议 09:30 前</div>
                            </div>
                            <div class="status-tag" style="background:rgba(255,255,255,0.05); color:var(--gray-600);">等待中</div>
                        </div>
                        <div class="task-actions">
                            <button class="action-btn btn-voice" onclick="openVoice('card-市府')">🎙️ 语音预报售后</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- PAGE: 已送达/待补录 -->
            <section id="delivered" class="page-section">
                <div class="task-scroll" id="list-delivered">
                    <!-- Cards will be moved here via JS -->
                    <div class="section-label">待补录 (售后/筐数)</div>
                </div>
            </section>

            <!-- PAGE: 已完成 -->
            <section id="closed" class="page-section">
                <div class="task-scroll" id="list-closed">
                    <div class="section-label">今日已结案</div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('pending')">
                <span class="nav-icon">🚚</span>
                <span class="nav-label">配送中</span>
            </div>
            <div class="nav-item" onclick="switchTab('delivered')">
                <span class="nav-icon">📦</span>
                <span class="nav-label">待补录</span>
            </div>
            <div class="nav-item" onclick="switchTab('closed')">
                <span class="nav-icon">✅</span>
                <span class="nav-label">已完成</span>
            </div>
        </nav>
    </div>

    <!-- Voice Reporting UI -->
    <div class="voice-sheet" id="reportSheet">
        <div class="sheet-handle"></div>
        <div class="voice-title" id="sheetTitle">录入售后/筐数</div>
        <div class="voice-desc" id="sheetDesc">您可以直接说：<br>"番茄烂了2板拍照了，今天留了12个筐收了10个"</div>

        <div class="mic-btn-container">
            <div class="mic-wave" id="micWave"></div>
            <button class="mic-btn" id="micBtn" onmousedown="startMic()" onmouseup="stopMic()" ontouchstart="startMic()" ontouchend="stopMic()">🎤</button>
        </div>

        <div class="ai-parsing" id="aiParsing">
            <div class="parsing-bubble">
                <div class="transcript" id="transcript">...</div>
            </div>
            <div class="ai-results">
                <div class="ai-item" id="ai-issue-block">
                    <div class="ai-label">售后项</div>
                    <div class="ai-val" id="ai-issue">番茄 · 损耗</div>
                </div>
                <div class="ai-item">
                    <div class="ai-label">周转筐 (留/收)</div>
                    <div class="ai-val" id="ai-crate">12 / 10</div>
                </div>
            </div>
        </div>

        <div class="photo-block" id="photoBlock">
            <button class="photo-btn" id="photoBtn" onclick="takePhoto()">
                <span class="photo-icon">📸</span>
                <span id="photoText">拍摄异常图片凭证</span>
            </button>
        </div>

        <button class="submit-voice-btn" id="submitBtn" onclick="submitReport()">确认并提交</button>
    </div>

    <div class="toast" id="toast">✅ 操作成功</div>

    <script>
        let currentCardId = null;
        let isPhotoTaken = false;
        let isClosed = false;

        function switchTab(id) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function openVoice(id) {
            currentCardId = id;
            const card = document.getElementById(id);
            isClosed = card.classList.contains('closed');
            
            document.getElementById('reportSheet').classList.add('show');
            document.getElementById('aiParsing').style.display = 'none';
            document.getElementById('photoBlock').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('micBtn').className = "mic-btn";
            isPhotoTaken = false;
            document.getElementById('photoBtn').className = "photo-btn";
            document.getElementById('photoText').innerText = "拍摄异常图片凭证";
            
            if (isClosed) {
                document.getElementById('sheetTitle').innerText = "补报售后";
                document.getElementById('sheetDesc').innerText = "该订单已结案，您仍可以补报售后信息";
            } else {
                document.getElementById('sheetTitle').innerText = "录入售后/筐数";
                document.getElementById('sheetDesc').innerText = "您可以直接说：'番茄烂了2板，今天留了12个筐收了10个'";
            }
        }

        function startMic() {
            document.getElementById('micBtn').classList.add('active');
            document.getElementById('micWave').style.display = 'block';
            document.getElementById('transcript').innerText = "正在倾听...";
        }

        function stopMic() {
            document.getElementById('micBtn').classList.remove('active');
            document.getElementById('micWave').style.display = 'none';
            
            // Simulating AI parsing
            setTimeout(() => {
                document.getElementById('aiParsing').style.display = 'block';
                document.getElementById('transcript').innerText = "“那个番茄损耗了2板我已经拍照了，今天留了12个筐，收回来10个。”";
                
                const hasIssue = true; // Sim simulation
                if (hasIssue) {
                    document.getElementById('ai-issue-block').style.display = 'block';
                    document.getElementById('photoBlock').style.display = 'block';
                } else {
                    document.getElementById('ai-issue-block').style.display = 'none';
                }
                
                document.getElementById('submitBtn').style.display = 'block';
            }, 800);
        }

        function takePhoto() {
            isPhotoTaken = true;
            document.getElementById('photoBtn').className = "photo-btn success";
            document.getElementById('photoText').innerText = "✅ 已拍摄 (1张)";
            showToast("📸 证据照片已保存");
        }

        function submitReport() {
            const card = document.getElementById(currentCardId);
            const issueContent = document.getElementById('ai-issue').innerText;
            
            if (document.getElementById('ai-issue-block').style.display !== 'none' && !isPhotoTaken) {
                alert("请先点击拍摄异常图片证据！"); return;
            }

            document.getElementById('reportSheet').style.display = 'none';
            
            if (isClosed) {
                const summary = card.querySelector('.task-summary');
                const issueRow = summary.querySelectorAll('.summary-row')[1];
                const val = issueRow.querySelector('.summary-val');
                val.innerHTML += `<br><span class="issue">${issueContent} <span class="summary-photo-tag">📷</span></span>`;
                showToast("✅ 售后补报成功");
            } else if (card.classList.contains('delivered')) {
                card.className = "task-card closed";
                card.querySelector('.status-tag').innerText = "已结案";
                card.querySelector('.status-tag').className = "status-tag tag-closed";
                if (card.querySelector('.notif-warn')) card.querySelector('.notif-warn').remove();
                
                const summary = document.createElement('div');
                summary.className = "task-summary";
                
                // Determine point-specific simulated balance
                let pointBal = (currentCardId === 'card-二中') ? "12" : (currentCardId === 'card-市府' ? "5" : "10");
                
                summary.innerHTML = `
                    <div class="summary-row">
                        <span class="summary-label">📦 周转筐</span>
                        <div class="summary-val">今日 12/10 · 结存 <b style="color:var(--blue-400);">${pointBal}</b></div>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">📢 售后</span>
                        <div class="summary-val"><span class="issue">${issueContent} <span class="summary-photo-tag">📷</span></span></div>
                    </div>
                `;
                card.querySelector('.task-main').after(summary);
                card.querySelector('.task-actions').innerHTML = `<button class="action-btn btn-voice" onclick="openVoice('${currentCardId}')">📢 语音补报</button>`;
                document.getElementById('list-closed').prepend(card);
                showToast("✅ 结案成功");
            } else {
                if (!card.querySelector('.notif-crate')) {
                    const badge = document.createElement('div');
                    badge.className = "task-notif notif-crate";
                    badge.innerText = "📦 已录筐数：留12/收10";
                    card.querySelector('.task-main').after(badge);
                }
                showToast("✅ 录入成功");
            }
        }

        function confirmDeliver(id) {
            const card = document.getElementById(id);
            card.className = "task-card delivered";
            card.querySelector('.status-tag').innerText = "待补录";
            card.querySelector('.status-tag').className = "status-tag tag-delivered";
            card.querySelector('.task-time').innerText = "刚刚确认送达";
            const warn = document.createElement('div');
            warn.className = "task-notif notif-warn";
            warn.innerText = "⚠️ 尚未记录周转筐回收数量";
            card.querySelector('.task-main').after(warn);
            card.querySelector('.task-actions').innerHTML = `<button class="action-btn btn-voice" style="background:var(--amber-600); color:white;" onclick="openVoice('${id}')">📢 语音录入 (售后/周转筐)</button>`;
            document.getElementById('list-delivered').appendChild(card);
            showToast("🚚 状态更新成功");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
