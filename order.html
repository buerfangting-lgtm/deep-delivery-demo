<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>归档控制台 — DeepDelivery</title>
    <link rel="stylesheet" href="styles/theme.css">
    <style>
        .page-layout { display: flex; flex-direction: column; height: 100vh; background: var(--gray-950); }

        .page-header {
            padding: 16px 20px; border-bottom: 1px solid var(--glass-border);
            display: flex; flex-direction: column; gap: 12px;
            background: rgba(3, 7, 18, 0.4); backdrop-filter: blur(12px); z-index: 100;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }

        /* Search Bar */
        .search-container { position: relative; width: 100%; }
        .search-input {
            width: 100%; padding: 10px 16px 10px 40px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--white); font-size: 14px; font-weight: 600;
            transition: all 0.3s;
        }
        .search-input:focus { background: rgba(255,255,255,0.08); border-color: var(--blue-500); outline: none; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5; }

        /* Main Viewport */
        .viewport { flex: 1; overflow-y: auto; position: relative; }
        .page-section { display: none; height: 100%; flex-direction: column; }
        .page-section.active { display: flex; }

        /* Status Filter (Pool Page) */
        .filter-bar {
            display: flex; overflow-x: auto; padding: 12px 20px; gap: 8px;
            background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-item {
            white-space: nowrap; padding: 6px 14px; border-radius: var(--radius-full);
            font-size: 12px; font-weight: 800; color: var(--gray-500);
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            transition: all 0.2s; cursor: pointer;
        }
        .filter-item.active { background: var(--blue-600); color: var(--white); border-color: var(--blue-500); box-shadow: 0 4px 12px rgba(37,99,235,0.2); }

        /* Scroll Area */
        .scroll-area { flex: 1; overflow-y: auto; padding: 20px 20px 100px; }
        .section-label { font-size: 11px; font-weight: 900; color: var(--gray-500); letter-spacing: 1.5px; margin: 24px 0 16px; text-transform: uppercase; }

        /* Order Card (Pool) */
        .order-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-xl); padding: 18px; margin-bottom: 16px;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .order-card:active { transform: scale(0.98); background: var(--glass-bg-hover); }
        .order-card.expanded { border-color: var(--blue-500); }
        
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .order-id { font-size: 11px; color: var(--gray-600); font-family: 'JetBrains Mono', monospace; font-weight: 700; }
        
        .status-badge { font-size: 10px; font-weight: 900; padding: 3px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--amber-500); }
        .status-processing { background: rgba(37,99,235,0.15); color: var(--blue-400); }
        .status-completed { background: rgba(34, 197, 94, 0.15); color: var(--green-400); }
        .status-archived { background: var(--glass-bg); color: var(--gray-500); }

        .order-title { font-size: 16px; font-weight: 800; color: var(--white); margin-bottom: 8px; }
        .order-meta { font-size: 12px; color: var(--gray-500); font-weight: 600; display: flex; gap: 12px; margin-bottom: 12px; }
        
        .order-detail-panel { 
            max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 1px solid transparent; padding-top: 0;
        }
        .order-card.expanded .order-detail-panel { max-height: 1000px; border-top-color: var(--glass-border); padding-top: 16px; margin-top: 12px; }

        /* Timeline in Detail Panel */
        .timeline { position: relative; padding-left: 20px; }
        .timeline::before { content: ''; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: var(--glass-border); }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-dot { position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--gray-700); border: 2px solid var(--gray-900); z-index: 2; }
        .timeline-item.active .timeline-dot { background: var(--blue-500); box-shadow: 0 0 8px var(--blue-500); }
        .timeline-item.completed .timeline-dot { background: var(--green-500); }
        
        .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .timeline-role { font-size: 11px; font-weight: 900; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px; }
        .timeline-time { font-size: 10px; color: var(--gray-600); font-weight: 700; }
        .timeline-content { font-size: 13px; color: var(--gray-300); font-weight: 600; line-height: 1.5; }
        .timeline-evidence { display: flex; gap: 8px; margin-top: 8px; }
        .evidence-tag { font-size: 10px; background: rgba(37,99,235,0.1); color: var(--blue-400); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(37,99,235,0.2); }

        /* Action Buttons */
        .action-bar { display: flex; gap: 10px; margin-top: 16px; }
        .btn-action { flex: 1; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 800; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--white); cursor: pointer; }
        .btn-pickup { background: var(--blue-600); border-color: var(--blue-500); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 72px;
            background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border); display: flex; z-index: 1000;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--gray-600); cursor: pointer; }
        .nav-item.active { color: var(--blue-400); }
        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 10px; font-weight: 800; }

        /* Tabs inside pages */
        .inner-tabs { display: flex; gap: 16px; padding: 0 20px; margin-bottom: 8px; }
        .inner-tab { font-size: 13px; font-weight: 800; color: var(--gray-500); padding: 12px 0; cursor: pointer; position: relative; }
        .inner-tab.active { color: var(--blue-400); }
        .inner-tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--blue-500); border-radius: 2px; }

        #toast {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            background: var(--blue-600); color: white; padding: 12px 24px;
            border-radius: 99px; font-weight: 900; font-size: 14px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); z-index: 5000; display: none;
        }
    </style>
</head>
<body>
    <div class="page-layout">
        <header class="page-header">
            <div class="header-top">
                <span class="page-title" id="pageTitle">售后工单池</span>
                <a href="select.html" style="text-decoration: none; font-size: 12px; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 20px; color: var(--gray-400); font-weight: 800; border: 1px solid var(--glass-border);">🔄 切换</a>
            </div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="搜索工单ID、点位、异常项目...">
            </div>
        </header>

        <!-- PAGE: POOL -->
        <section id="pool" class="page-section active">
            <div class="filter-bar">
                <div class="filter-item active">全部 (12)</div>
                <div class="filter-item">待领取 (3)</div>
                <div class="filter-item">处理中 (4)</div>
                <div class="filter-item">已完成 (5)</div>
            </div>

            <div class="scroll-area" id="pool-list">
                <!-- Content will be rendered by JS -->
            </div>
        </section>

        <!-- PAGE: MY ORDERS -->
        <section id="my" class="page-section">
            <div class="inner-tabs">
                <div class="inner-tab active" onclick="switchInnerTab('my-pending')">进行中</div>
                <div class="inner-tab" onclick="switchInnerTab('my-completed')">已结案</div>
            </div>
            <div class="scroll-area" id="my-list">
                <!-- Content via JS -->
            </div>
        </section>

        <!-- PAGE: PROFILE -->
        <section id="profile" class="page-section">
            <div class="scroll-area">
                <div class="section-label">📊 个人效能统计</div>
                <div class="order-card" style="padding:24px; text-align:center;">
                    <div style="font-size:32px; font-weight:900; color:var(--white);">12</div>
                    <div style="font-size:12px; color:var(--gray-500); margin-top:4px;">今日处理工单</div>
                    <div style="margin-top:20px; display:flex; gap:10px;">
                        <div style="flex:1; background:rgba(255,255,255,0.03); padding:12px; border-radius:8px;">
                            <div style="font-size:16px; color:var(--blue-400); font-weight:900;">98%</div>
                            <div style="font-size:10px; color:var(--gray-600);">及时率</div>
                        </div>
                        <div style="flex:1; background:rgba(255,255,255,0.03); padding:12px; border-radius:8px;">
                            <div style="font-size:16px; color:var(--green-400); font-weight:900;">4.9</div>
                            <div style="font-size:10px; color:var(--gray-600);">客户评分</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchMainTab('pool')">
                <span class="nav-icon">📦</span>
                <span class="nav-label">工单池</span>
            </div>
            <div class="nav-item" onclick="switchMainTab('my')">
                <span class="nav-icon">🛠️</span>
                <span class="nav-label">我的</span>
            </div>
            <div class="nav-item" onclick="switchMainTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">效能</span>
            </div>
        </nav>
    </div>

    <div id="toast">✅ 操作成功</div>

    <script>
        const poolOrders = [
            { id: 'AS-101', point: '温州二中', item: '豆腐', type: '换货', time: '10:15', status: 'processing', history: [
                { role: '司机', time: '06:45', content: '上报豆腐损毁', evidence: ['图片证据', '语音存证'] },
                { role: '调度', time: '08:20', content: '审核通过，发起换货单', active: true }
            ]},
            { id: 'AS-102', point: '实验小学', item: '青菜', type: '退货', time: '10:30', status: 'pending', history: [
                { role: '司机', time: '07:12', content: '上报青菜发黄', evidence: ['图片证据'] }
            ]},
            { id: 'AS-103', point: '市府办食堂', item: '牛肉', type: '补货', time: '09:45', status: 'completed', history: [
                { role: '司机', time: '06:30', content: '确认缺货 2kg', evidence: ['语音存证'] },
                { role: '调度', time: '07:00', content: '安排补货车', completed: true },
                { role: '客服', time: '09:45', content: '客户确认收到', completed: true }
            ]}
        ];

        const clerkOrders = poolOrders; // Simulating

        function renderPool() {
            const list = document.getElementById('pool-list');
            list.innerHTML = '';
            poolOrders.forEach(o => {
                const card = document.createElement('div');
                card.className = `order-card animate-fadeInUp`;
                card.onclick = () => card.classList.toggle('expanded');
                
                const statusMap = {
                    'pending': { text: '待领取', class: 'status-pending' },
                    'processing': { text: '处理中', class: 'status-processing' },
                    'completed': { text: '已完成', class: 'status-completed' }
                };
                const s = statusMap[o.status];

                let timelineHtml = '<div class="timeline">';
                o.history.forEach(h => {
                    let evidenceHtml = h.evidence ? `<div class="timeline-evidence">${h.evidence.map(e => `<span class="evidence-tag">${e}</span>`).join('')}</div>` : '';
                    timelineHtml += `
                        <div class="timeline-item ${h.active ? 'active' : ''} ${h.completed ? 'completed' : ''}">
                            <div class="timeline-dot"></div>
                            <div class="timeline-header">
                                <span class="timeline-role">${h.role}</span>
                                <span class="timeline-time">${h.time || ''}</span>
                            </div>
                            <div class="timeline-content">${h.content}${evidenceHtml}</div>
                        </div>
                    `;
                });
                timelineHtml += '</div>';

                card.innerHTML = `
                    <div class="order-header">
                        <span class="order-id">ID: ${o.id}</span>
                        <span class="status-badge ${s.class}">${s.text}</span>
                    </div>
                    <div class="order-title">${o.point} · ${o.type}</div>
                    <div class="order-meta">
                        <span>🕒 ${o.time}</span>
                        <span>📄 ${o.history.length} 条记录</span>
                    </div>
                    <div class="order-detail-panel">
                        ${timelineHtml}
                        <div class="action-bar">
                            ${o.status === 'pending' ? `<button class="btn-action btn-pickup" onclick="archive('${o.id}')">领取处理</button>` : ''}
                            <button class="btn-action" onclick="archive('${o.id}')">归档记录</button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function renderClerkOrders(filter = 'my-pending') {
            const list = document.getElementById('my-list');
            list.innerHTML = '';
            
            const filtered = filter === 'my-pending' ? clerkOrders.filter(o => o.status === 'pending') : clerkOrders.filter(o => o.status !== 'pending');
            
            filtered.forEach(o => {
                const card = document.createElement('div');
                card.className = `order-card animate-fadeInUp`;
                card.onclick = () => card.classList.toggle('expanded');
                
                const statusMap = {
                    'pending': { text: '处理中', class: 'status-processing' },
                    'completed': { text: '已完成', class: 'status-completed' }
                };
                const s = statusMap[o.status];

                let timelineHtml = '<div class="timeline">';
                o.history.forEach(h => {
                    let evidenceHtml = h.evidence ? `<div class="timeline-evidence">${h.evidence.map(e => `<span class="evidence-tag">${e}</span>`).join('')}</div>` : '';
                    timelineHtml += `
                        <div class="timeline-item ${h.active ? 'active' : ''} ${h.completed ? 'completed' : ''}">
                            <div class="timeline-dot"></div>
                            <div class="timeline-header">
                                <span class="timeline-role">${h.role}</span>
                                <span class="timeline-time">${h.time || ''}</span>
                            </div>
                            <div class="timeline-content">${h.content}${evidenceHtml}</div>
                        </div>
                    `;
                });
                timelineHtml += '</div>';

                card.innerHTML = `
                    <div class="order-header">
                        <span class="order-id">ID: ${o.id}</span>
                        <span class="status-badge ${s.class}">${s.text}</span>
                    </div>
                    <div class="order-title">${o.point} · ${o.type}</div>
                    <div class="order-meta">
                        <span>🕒 ${o.time}</span>
                        <span>📄 ${o.history.length} 条记录</span>
                    </div>
                    <div class="order-detail-panel">
                        ${timelineHtml}
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function switchMainTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            
            const targetNav = document.querySelector(`.nav-item[onclick*="${tabId}"]`);
            if (targetNav) targetNav.classList.add('active');
            
            document.getElementById(tabId).classList.add('active');
            
            const titles = { 'pool': '售后工单池', 'my': '我的工单', 'profile': '个人中心' };
            document.getElementById('pageTitle').innerText = titles[tabId];

            if (tabId === 'my') renderClerkOrders();
        }

        function switchInnerTab(tabId) {
            document.querySelectorAll('.inner-tab').forEach(el => el.classList.remove('active'));
            const targetTab = document.querySelector(`.inner-tab[onclick*="${tabId}"]`);
            if (targetTab) targetTab.classList.add('active');
            
            if (tabId.startsWith('my-')) {
                renderClerkOrders(tabId);
            }
        }

        function archive(id) {
            showToast("✅ 归档成功");
            document.getElementById(id).style.opacity = '0.3';
            document.getElementById(id).style.pointerEvents = 'none';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        // Init
        renderPool();
    </script>
</body>
</html>
